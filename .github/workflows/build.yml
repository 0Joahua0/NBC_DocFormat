name: Build and Release

# === 关键修复：添加此权限声明 ===
permissions:
  contents: write
# ==============================

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test-linux-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth desktop-file-utils
          python -m pip install -r requirements-dev.txt
      - name: Test with an X11 display
        run: xvfb-run -a python -m pytest -q

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Windows executable
        run: |
          python build.py windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/NBC_DocFormat_windows.exe

  build-windows-win7:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win7.txt

      - name: Build Windows 7 compatible executable
        run: |
          python build.py windows
        env:
          WINDOWS_OUTPUT_NAME: NBC_DocFormat_windows_win7

      - name: Upload Windows 7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-win7-build
          path: dist/NBC_DocFormat_windows_win7.exe

  build-linux:
    needs: test-linux-ui
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y epel-release
          dnf install -y \
            gcc gcc-c++ make \
            python39 python39-pip python39-tkinter python39-devel \
            squashfs-tools wget git findutils file \
            glibc-langpack-zh
          python3.9 -m pip install --upgrade pip

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3.9 -m pip install pyinstaller python-docx

      - name: Build Linux executable
        run: |
          export LC_ALL=zh_CN.UTF-8
          DOCX_TEMPLATES=$(python3.9 -c "import docx, os; print(os.path.join(os.path.dirname(docx.__file__), 'templates'))")
          pyinstaller --onedir --name=NBC_DocFormat_linux \
            --add-data "scripts:scripts" \
            --add-data "assets/icon.png:assets" \
            --add-data "assets/feature_smart.png:assets" \
            --add-data "assets/feature_analyze.png:assets" \
            --add-data "assets/feature_punctuation.png:assets" \
            --add-data "LICENSE:." \
            --add-data "LICENSE-HISTORY.md:." \
            --add-data "${DOCX_TEMPLATES}:docx/templates" \
            --hidden-import=docx --hidden-import=lxml \
            NBC_DocFormat.py

      - name: Archive installed-layout bundle
        run: tar -C dist -czf dist/NBC_DocFormat_linux_bundle.tar.gz NBC_DocFormat_linux

      - name: Build AppImage (amd64)
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          packaging/appimage/build-appimage.sh \
            dist/NBC_DocFormat_linux \
            assets/icon.png \
            NBC_DocFormat_linux_amd64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/NBC_DocFormat_linux_amd64.AppImage
            dist/NBC_DocFormat_linux_bundle.tar.gz

  build-linux-arm64:
    needs: test-linux-ui
    runs-on: ubuntu-22.04-arm
    container:
      image: almalinux:8
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y epel-release
          dnf install -y \
            gcc gcc-c++ make \
            python39 python39-pip python39-tkinter python39-devel \
            squashfs-tools wget git findutils file \
            glibc-langpack-zh
          python3.9 -m pip install --upgrade pip

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3.9 -m pip install pyinstaller python-docx

      - name: Build Linux ARM64 executable
        run: |
          export LC_ALL=zh_CN.UTF-8
          DOCX_TEMPLATES=$(python3.9 -c "import docx, os; print(os.path.join(os.path.dirname(docx.__file__), 'templates'))")
          pyinstaller --onedir --name=NBC_DocFormat_linux \
            --add-data "scripts:scripts" \
            --add-data "assets/icon.png:assets" \
            --add-data "assets/feature_smart.png:assets" \
            --add-data "assets/feature_analyze.png:assets" \
            --add-data "assets/feature_punctuation.png:assets" \
            --add-data "LICENSE:." \
            --add-data "LICENSE-HISTORY.md:." \
            --add-data "${DOCX_TEMPLATES}:docx/templates" \
            --hidden-import=docx --hidden-import=lxml \
            NBC_DocFormat.py

      - name: Archive installed-layout bundle
        run: tar -C dist -czf dist/NBC_DocFormat_linux_bundle.tar.gz NBC_DocFormat_linux

      - name: Build AppImage (aarch64)
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          packaging/appimage/build-appimage.sh \
            dist/NBC_DocFormat_linux \
            assets/icon.png \
            NBC_DocFormat_linux_aarch64

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-build
          path: |
            dist/NBC_DocFormat_linux_aarch64.AppImage
            dist/NBC_DocFormat_linux_bundle.tar.gz

  package-linux-deb:
    needs: [build-linux, build-linux-arm64]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            artifact: linux-build
            runner: ubuntu-22.04
          - arch: arm64
            artifact: linux-arm64-build
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - name: Build Debian package from AlmaLinux bundle
        run: |
          tar -C dist -xzf dist/NBC_DocFormat_linux_bundle.tar.gz
          bash packaging/linux/build-deb.sh dist/NBC_DocFormat_linux ${{ matrix.arch }}
          dpkg-deb --info dist/NBC_DocFormat_linux_${{ matrix.arch }}.deb
      - name: Verify installed application starts
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth ./dist/NBC_DocFormat_linux_${{ matrix.arch }}.deb
          status=0
          xvfb-run -a timeout 8s NBC_DocFormat_linux > dist/linux-startup.log 2>&1 || status=$?
          cat dist/linux-startup.log
          test "$status" -eq 124
          python3 -c "from pathlib import Path; assert 'Traceback' not in Path('dist/linux-startup.log').read_text()"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ matrix.arch }}
          path: dist/NBC_DocFormat_linux_${{ matrix.arch }}.deb

  build-macos:
    name: build-macos (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: intel
            runner: macos-26-intel
            output_name: NBC_DocFormat_macos_intel
            artifact_name: macos-intel-build
          - arch_label: apple-silicon
            runner: macos-26
            output_name: NBC_DocFormat_macos_apple_silicon
            artifact_name: macos-apple-silicon-build
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-docx

      - name: Import Apple Developer ID certificate
        if: env.MACOS_CERTIFICATE_BASE64 != '' || env.MACOS_CERT_P12_BASE64 != ''
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id_application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-temporary-keychain-password}"
          CERTIFICATE_BASE64="${MACOS_CERTIFICATE_BASE64:-$MACOS_CERT_P12_BASE64}"
          CERTIFICATE_PASSWORD="${MACOS_CERTIFICATE_PASSWORD:-$MACOS_CERT_P12_PASSWORD}"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build macOS DMG
        run: |
          if [ -n "$MACOS_NOTARY_APPLE_ID" ] && [ -n "$MACOS_NOTARY_TEAM_ID" ] && [ -n "$MACOS_NOTARY_PASSWORD" ]; then
            export MACOS_REQUIRE_NOTARIZATION=1
            echo "Notarization credentials detected; notarization is required for this macOS build."
          else
            export MACOS_REQUIRE_NOTARIZATION=0
            echo "::warning::Notarization secrets are incomplete; building a signed but non-notarized macOS DMG."
          fi
          python -u build.py macos
        env:
          MACOS_OUTPUT_NAME: ${{ matrix.output_name }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.output_name }}.dmg
            dist/${{ matrix.output_name }}.app
            dist/${{ matrix.output_name }}

  release:
    needs: [build-windows, build-windows-win7, build-linux, build-linux-arm64, package-linux-deb, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Generate release notes
        run: |
          python3 - <<'PY'
          import os
          import build
          assert os.environ["GITHUB_REF_NAME"] == f"v{build.VERSION}", "Tag and build version must match"
          build.create_release_notes()
          PY

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/
      - name: Download Windows 7 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-win7-build
          path: dist/
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/
      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-build
          path: dist/
      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-build
          path: dist/
      - name: Download Linux Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: linux-deb-*
          merge-multiple: true
          path: dist/
      - name: Download macOS Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-apple-silicon-build
          path: dist/

      - name: List dist contents
        run: ls -laR dist/

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: NBC_DocFormat ${{ steps.get_version.outputs.VERSION }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/NBC_DocFormat_windows.exe
            dist/NBC_DocFormat_windows_win7.exe
            dist/NBC_DocFormat_linux_amd64.AppImage
            dist/NBC_DocFormat_linux_aarch64.AppImage
            dist/NBC_DocFormat_linux_amd64.deb
            dist/NBC_DocFormat_linux_arm64.deb
            dist/NBC_DocFormat_macos_intel.dmg
            dist/NBC_DocFormat_macos_apple_silicon.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
